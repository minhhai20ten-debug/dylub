name: Build WitchAccounts

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Theos
      run: |
        git clone --recursive https://github.com/theos/theos.git ${{ github.workspace }}/theos

    - name: Build Dylib
      run: |
        export THEOS=${{ github.workspace }}/theos
        export SDKPATH=$(xcrun --sdk iphoneos --show-sdk-path)
        make clean
        make FINALPACKAGE=1
      env:
        ARCHS: "arm64 arm64e"

    - name: Upload Dylib
      uses: actions/upload-artifact@v4
      with:
        name: WitchAccounts-Dylib
        path: |
          .theos/obj/debug/*.dylib
          .theos/obj/*.dylib
          packages/*.deb
