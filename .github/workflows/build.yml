name: Build WitchAccounts

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build Dylib
      run: |
        xcrun -sdk iphoneos clang \
          -arch arm64 \
          -arch arm64e \
          -miphoneos-version-min=14.0 \
          -shared \
          -x objective-c \
          -framework Foundation \
          -framework UIKit \
          Tweak.xm \
          -o WitchAccounts.dylib

    - name: Upload Dylib
      uses: actions/upload-artifact@v4
      with:
        name: WitchAccounts-Dylib
        path: WitchAccounts.dylib
